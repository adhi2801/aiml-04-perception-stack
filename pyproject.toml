[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perception"
version = "0.1.0"
description = "Camera perception stack: YOLO + ByteTrack, lanes, MiDaS depth, AEB; CARLA + ROS2; ONNX/TensorRT"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["ros2_ws/build", "ros2_ws/install", "runs", "data", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PERF", "RUF"]
# RUF001: the × and – characters in plot labels and docstrings are intended.
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
# Augmentation draws from NumPy's global RNG on purpose: PyTorch (>=1.9) reseeds it in every DataLoader worker.
"src/perception/lanes/seg_model.py" = ["NPY002"]
