name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (CPU, no CARLA/TensorRT needed for unit tests)
        run: |
          uv venv --python 3.12
          uv pip install numpy opencv-python-headless pyyaml pytest
          uv pip install --no-deps -e .
      - run: .venv/bin/python -m pytest -q

  ros2:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Build the ROS2 package
        shell: bash
        run: |
          apt-get update && apt-get install -y ros-jazzy-vision-msgs python3-colcon-common-extensions
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws && colcon build --symlink-install
          source install/setup.bash && ros2 pkg executables perception_ros
