name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Lint and format (ruff, rules in pyproject.toml)
        run: |
          uvx ruff@0.14.5 check src carla_tools tests scripts ros2_ws/src
          uvx ruff@0.14.5 format --check src carla_tools tests scripts ros2_ws/src
      - name: README results match reports/*.json (no number typed by hand)
        run: python3 scripts/results_table.py --check

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (CPU, no CARLA/TensorRT needed for unit tests)
        run: |
          uv venv --python 3.12
          uv pip install numpy opencv-python-headless pyyaml pytest
          uv pip install --no-deps -e .
      - name: Byte-compile every module (catches syntax errors in scripts the tests do not import)
        run: .venv/bin/python -m compileall -q src carla_tools tests ros2_ws
      - run: .venv/bin/python -m pytest -q

  ros2:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Build the ROS2 package
        shell: bash
        run: |
          apt-get update && apt-get install -y ros-jazzy-vision-msgs python3-colcon-common-extensions
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws && colcon build --symlink-install
          source install/setup.bash && ros2 pkg executables perception_ros
